# Nginx site for Dandiya Nights (website + API on one domain).
# Install:  sudo cp deploy/nginx-dandiya.conf /etc/nginx/sites-available/dandiya
#           sudo ln -s /etc/nginx/sites-available/dandiya /etc/nginx/sites-enabled/dandiya
#           sudo nginx -t && sudo systemctl reload nginx
# HTTPS is added afterwards by: sudo certbot --nginx -d dandiyaevent.arthotthanaparishat.in

server {
    listen 80;
    listen [::]:80;
    server_name dandiyaevent.arthotthanaparishat.in;

    # Built React app (npm run build in client/)
    root /var/www/dandiya-nights/client/dist;
    index index.html;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Backend API (Node/Express on localhost:5000). Keeps the /api prefix.
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /poster.jpg {
        expires 7d;
    }

    # Single-page app: every other path serves index.html (never cached).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
