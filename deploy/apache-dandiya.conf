# Apache virtual host: forwards dandiyaevent.arthotthanaparishat.in to the Docker
# containers on 127.0.0.1:8080. Other sites on this Apache are not affected.
#
# Install (CentOS/RHEL):
#   cp deploy/apache-dandiya.conf /etc/httpd/conf.d/dandiya.conf
#   apachectl configtest && systemctl reload httpd
# Then HTTPS:  certbot --apache -d dandiyaevent.arthotthanaparishat.in
#   (certbot adds the :443 virtual host and the HTTP -> HTTPS redirect)

<VirtualHost *:80>
    ServerName dandiyaevent.arthotthanaparishat.in

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 60

    # Tell the app whether the visitor used HTTP or HTTPS.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Let's Encrypt validation is answered by Apache itself, not proxied.
    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    ErrorLog  /var/log/httpd/dandiya-error.log
    CustomLog /var/log/httpd/dandiya-access.log combined
</VirtualHost>
